name: Telegram Auto Post

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Jaanch (validate)
        run: python publish.py --check || true

      - name: Due posts bhejo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python publish.py

      - name: Status wapas save karo
        run: |
          git config user.name "telegram-bot"
          git config user.email "telegram-bot@users.noreply.github.com"
          git add schedule.json
          git diff --cached --quiet || (git commit -m "update post status" && git push)
