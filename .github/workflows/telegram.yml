name: Telegram Auto Post

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: telegram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Jaanch (validate)
        run: python publish.py --check || true

      # GitHub ka cron der se chalta hai, isliye ye run khud ~5h40m tak
      # chalta rehta hai aur har 5 minute me due posts bhejta hai.
      - name: Posts bhejte raho (har 5 minute)
        id: send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "telegram-bot"
          git config user.email "telegram-bot@users.noreply.github.com"
          fail=0
          while [ "$SECONDS" -lt 20400 ]; do
            git pull -q --rebase || true
            python publish.py || fail=1
            git add status.json || true
            if ! git diff --cached --quiet; then
              git commit -q -m "update post status"
              for i in 1 2 3; do
                git pull -q --rebase && git push -q && break
                sleep 5
              done
            fi
            sleep 300
          done
          exit $fail

      - name: Agla run khud shuru karo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run telegram.yml --ref main || true
